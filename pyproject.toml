[project]
name = "exatamed"
version = "2.0.0"
description = "Gestão de estoque e dispensação para farmácia hospitalar"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["exatamed/static"]

[tool.ruff.lint]
# Erros, avisos, imports, bugs prováveis (bugbear), segurança (bandit) e simplificações.
select = ["E", "W", "F", "I", "B", "S", "UP", "SIM"]
ignore = [
    "S101",   # assert é usado nos testes
    "S311",   # random dos dados de demonstração não é criptográfico (não precisa ser)
    "S608",   # SQL montado só com nomes de tabelas/colunas fixos do próprio código (migrações)
    "UP017",  # datetime.UTC exige Python 3.11
    "B905",   # zip(strict=...) exige Python 3.10+ em todo o código; avaliado caso a caso
    "SIM108", # ternários longos prejudicam a leitura
    "E741",   # convenção do código: "l" para lote em compreensões curtas
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["exatamed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
