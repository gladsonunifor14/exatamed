{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <div class="display-6 fw-bold text-exata"><i class="bi bi-capsule-pill"></i> ExataMed</div>
      <div class="text-muted">Gestão de estoque da farmácia hospitalar</div>
    </div>
    <form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="card-body p-4">
        <div class="mb-3"><label class="form-label" for="login">Usuário</label>
          <input class="form-control" id="login" name="login" autocomplete="username" required autofocus value="{{ request.form.login }}"></div>
        <div class="mb-3"><label class="form-label" for="senha">Senha</label>
          <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-exata w-100"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
      </div>
    </form>
    <p class="text-muted small text-center mt-3">Esqueceu a senha? Procure o administrador do sistema.</p>
  </div>
</div>
{% endblock %}
