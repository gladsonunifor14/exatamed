{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="text-center py-5">
  <h1 class="h3">{{ titulo }}</h1>
  <p class="text-muted">{{ mensagem }}</p>
  {% if codigo %}<p class="small">Código do erro: <code>{{ codigo }}</code></p>{% endif %}
  <a class="btn btn-exata" href="{{ url_for('principal.painel') }}">Voltar ao painel</a>
</div>
{% endblock %}
