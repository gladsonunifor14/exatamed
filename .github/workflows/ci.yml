name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  testes:
    name: Testes (${{ matrix.banco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        banco: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exatamed
          POSTGRES_PASSWORD: exatamed
          POSTGRES_DB: exatamed_testes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exatamed" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Vazio no SQLite (usa banco em memória); no PostgreSQL inclui o teste de concorrência real.
      EXATAMED_TESTE_BANCO: ${{ matrix.banco == 'postgresql' && 'postgresql+psycopg://exatamed:exatamed@localhost:5432/exatamed_testes' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock pytest
      - run: python -m pytest -q

  dependencias:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t exatamed:ci .
      - name: Sobe a imagem e confere /saude
        run: |
          docker run -d --name exatamed -p 8000:8000 -e EXATAMED_SECRET_KEY=ci -e EXATAMED_CHAVE_AUDITORIA=ci exatamed:ci
          for i in $(seq 30); do curl -fsS http://localhost:8000/saude && exit 0; sleep 1; done
          docker logs exatamed; exit 1
