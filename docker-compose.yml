# Instalação em servidor próprio (on-premises) com PostgreSQL.
#   1. cp .env.exemplo .env   e preencha as chaves
#   2. docker compose up -d
#   3. Acesse http://servidor:8000 (em produção, publique atrás de um proxy HTTPS)
services:
  banco:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: exatamed
      POSTGRES_USER: exatamed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exatamed"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      EXATAMED_DATABASE_URL: postgresql+psycopg://exatamed:${POSTGRES_PASSWORD}@banco:5432/exatamed

volumes:
  dados_banco:
