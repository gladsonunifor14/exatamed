# Blueprint do Render: cria o sistema web e o banco PostgreSQL automaticamente.
# No painel do Render: New > Blueprint > selecione este repositório.
services:
  - type: web
    name: exatamed
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload --workers 2 --bind 0.0.0.0:$PORT "exatamed:create_app()"
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: EXATAMED_ENV
        value: production
      - key: EXATAMED_SECRET_KEY
        generateValue: true
      # Chave da cadeia de auditoria: gerada uma vez pelo Render. NUNCA a altere depois.
      - key: EXATAMED_CHAVE_AUDITORIA
        generateValue: true
      # Primeiro administrador, criado na primeira inicialização (se não houver usuários).
      # O Render pede a senha ao aplicar o Blueprint (mínimo de 8 caracteres).
      - key: EXATAMED_ADMIN_LOGIN
        value: admin
      - key: EXATAMED_ADMIN_SENHA
        sync: false
      - key: EXATAMED_DATABASE_URL
        fromDatabase:
          name: exatamed-db
          property: connectionString

databases:
  - name: exatamed-db
    plan: free
    databaseName: exatamed
    user: exatamed
